name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs of the same workflow on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions; each job escalates only what it needs.
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Backend: Python 3.12 + pytest with service containers
  # ─────────────────────────────────────────────────────────────
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    if: hashFiles('backend/requirements.txt') != ''
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ktutor
          POSTGRES_PASSWORD: ktutor_password
          POSTGRES_DB: ktutor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ktutor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/ready || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      chroma:
        image: chromadb/chroma:latest
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      deepseek-ocr-2:
        # Stub: the real service is started by install_deepseek_ocr.bat
        # in local dev. In CI we expose a stub HTTP echo so the OCR client
        # gets a valid (if empty) response and the tests that mock httpx
        # are unaffected. Tests that need the real OCR are marked
        # @pytest.mark.integration and skipped here.
        image: kennethreitz/httpbin
        ports:
          - 8500:80
    env:
      # PostgreSQL
      DATABASE_URL: postgresql://ktutor:ktutor_password@localhost:5432/ktutor
      # MinIO
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: ktutor-test
      # ChromaDB (HTTP server)
      CHROMA_SERVER_URL: http://localhost:8000
      # LLM / vision
      LLM_PROVIDER: minimax
      VISION_PROVIDER: deepseek-ocr-2
      DEEPSEEK_OCR_URL: http://localhost:8500
      # Test flag
      PYTEST_ADDOPTS: "-ra --strict-markers"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app tests
        continue-on-error: true   # linter introduced later; don't fail CI before it lands

      - name: Run tests
        run: |
          mkdir -p data/chroma_db
          pytest --cov=app --cov-report=term-missing --cov-fail-under=70 -m "not integration"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/.coverage
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # Frontend: Node 20 + lint + build (only if frontend/ exists)
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    if: hashFiles('frontend/package.json') != ''
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true   # lint introduced in s11

      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true   # strict TypeScript comes in s11

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # Markdown lint on docs/ (lightweight, fast)
  # ─────────────────────────────────────────────────────────────
  docs:
    name: Docs (markdown lint)
    runs-on: ubuntu-latest
    if: hashFiles('docs/**/*.md') != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: |
            docs/**/*.md
            README.md
          config: .markdownlint.jsonc

  # ─────────────────────────────────────────────────────────────
  # PR title + description linter (conventional commits)
  # ─────────────────────────────────────────────────────────────
  pr-lint:
    name: PR title (conventional commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Conventional commits prefixes accepted by the project (AGENTS.md § Git et PR)
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject must start with a lowercase letter.
            Example: "feat(api): add /documents/upload"
