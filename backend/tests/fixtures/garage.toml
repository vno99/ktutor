# Garage S3 server config for CI.
# Mirrored from docs/architecture.md (S3-compatible object store).
# Region set to us-east-1 so the minio>=7.2 Python client (which sends
# us-east-1 by default) signs requests with the right region.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "ktutor-ci-admin-token"
